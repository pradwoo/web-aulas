<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lâmpada com JavaScript</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="container">
        <h1>Minha Lâmpada</h1>

        <div class="lampada">
            <!-- A imagem inicial é a lâmpada apagada -->
            <img id="imagemLampada" 
                 src="images/lampada-apagada.png" 
                 alt="Lâmpada apagada">
        </div>

        <!-- Este texto será alterado pelo JavaScript -->
        <h2 id="textoEstado">Lâmpada apagada!</h2>

        <div class="botoes">
            <button id="btnAcender" class="btn acender">Acender</button>
            <button id="btnApagar" class="btn apagar">Apagar</button>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
