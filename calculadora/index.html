<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="style.css">
</head>
<body><!--- comentario --> 
    <header>
        <h1>calculadora foderosa muito foda</h1>
    </header>
    <main>

        <input type="text" id="display" value="0" readonly disabled>

        <div id="teclado">
            <button id="btn7">7</button>
            <button id="btn8">8</button>
            <button id="btn9">9</button>
            <button id="btnMulti">*</button>

            <button id="btn4">4</button>
            <button id="btn5">5</button>
            <button id="btn6">6</button>
            <button id="btnMenos">-</button>
            
            <button id="btn1"> 1</button>
            <button id="btn2">2</button>
            <button id="btn3">3</button>
            <button id="btnSoma">+</button>
            
            <button id="btn0">0</button>
            <button id="btnApaga">C</button>
            <button id="btnResult">=</button>
            <button id="btnDiv">/</button>
        </div>
    </main>


    <script src="script.js"></script>
</body>
</html>
